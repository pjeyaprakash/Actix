services:

  # =========================
  # Actix Backend
  # =========================
  backend:
    image: billing-backend:${APP_VERSION:-1.0.0}
    container_name: billing_backend
    restart: unless-stopped

    ports:
      - "${APP_PORT:-8080}:8080"

    environment:
      RUST_LOG: ${RUST_LOG:-info}
      RUST_BACKTRACE: "0"
      TZ: ${TZ:-Asia/Kolkata}

      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      REDIS_URL: redis://redis:6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - billing_network

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3


  # =========================
  # PostgreSQL
  # =========================
  postgres:
    image: postgres:18.6
    container_name: billing_postgres
    restart: unless-stopped

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Kolkata}

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - billing_network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # =========================
  # Redis
  # =========================
  redis:
    image: redis:8-alpine
    container_name: billing_redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

    networks:
      - billing_network

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


# =========================
# Persistent Storage
# =========================
volumes:

  postgres_data:
    name: billing_postgres_data

  redis_data:
    name: billing_redis_data


# =========================
# Internal Network
# =========================
networks:

  billing_network:
    name: billing_network
    driver: bridge