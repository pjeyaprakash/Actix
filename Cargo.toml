[package]
name = "billing_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7.2"
actix-web = "4.15.0"
bytes = "1.12.1"
deadpool-postgres = "0.14.2"
dotenvy = "0.15.7"
futures-util = "0.3.34"
prost = "0.14.4"
prost-types = "0.14.4"
refinery = { version = "0.9.2", features = ["tokio-postgres"] }
tokio-postgres = "0.7.18"
thiserror = "2.0.20"
bcrypt = "0.19.3"
cookie = "0.18.2"
chrono = "0.4.45"
jsonwebtoken = "11.0.0"
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.26.1", features = ["v4"] }



[build-dependencies]
glob = "0.3.4"
prost-build = "0.14.4"



